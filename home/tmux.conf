# True color + Nerd Font glyph support -- tmux's default TERM handling
# doesn't pass these through, which is why the powerlevel10k prompt this
# repo installs a Nerd Font for can render broken specifically inside tmux
# even though it works fine in a bare shell.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Mouse: click to select a pane, drag a border to resize, wheel to scroll
set -g mouse on

# Start windows/panes at 1, not 0 -- easier to reach on a keyboard
set -g base-index 1
setw -g pane-base-index 1

set -g history-limit 10000
