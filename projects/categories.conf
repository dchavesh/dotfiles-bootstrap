# Non-secret manifest: the project taxonomy for ~/projects/<identity>/<category>/<slug>
# Drives tools/new-project's validation. Adjust freely -- this is meant to
# be edited as your actual usage evolves, not treated as fixed forever.
#
# identity      category      description
personal        clients       Client project work
personal        labs          Experiments and spikes, not yet a real product
personal        learning      Courses, tutorials, practice (non-university)
personal        oss           Open-source contributions
personal        public        Public-facing / portfolio projects
personal        systems       Infra and machine tooling (e.g. this repo)
personal        templates     Reusable project boilerplate
personal        tools         Personal utility scripts/CLIs
kolora          product       Core make-up product/app codebase
kolora          marketing     Marketing site, campaigns, brand assets
kolora          ops           Business/ops tooling, non-product
kolora          experiments   Early-stage ideas not yet committed to product
blite           product       Active software products being built
blite           concepts      Early-stage ideas, not yet in active development
blite           brand         Branding/design work
blite           hackathons    Hackathon/competition entries -- prefix the slug with the year, e.g. 2026-event-name
blite           clients       Contract/client development work
university      coursework    Class projects -- see projects/README.md for the term + roman-numeral naming convention
